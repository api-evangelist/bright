aid: bright
name: Bright
description: >-
  Bright is Mexico's leading residential and commercial solar energy provider,
  founded in 2014 (Y Combinator W15) by Jonah Greenberger. Often described as
  "Sunrun for the developing world," Bright combines financing and software to
  let homeowners and businesses adopt rooftop solar and battery energy storage
  (BESS) at no upfront cost. The company operates a marketplace connecting a
  network of local installers, distributors, and retail promoters with customers,
  and offers financing models such as solar PPAs and leasing schemes. Bright's
  public web presence is a Wix-hosted marketing site (thinkbright.mx) covering
  its industrial, commercial, and home solutions, success cases, and 24/7 energy
  monitoring technology. It exposes an agent-facing surface via an llms.txt and a
  hosted Wix Site MCP endpoint, but publishes no first-party developer/REST API.
